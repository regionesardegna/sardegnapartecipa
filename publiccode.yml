description:
  it:
    genericName: Piattaforma per la partecipazione
    shortDescription: >-
      Sardegna ParteciPA è un fork di Decidim, la piattaforma spagnola di democrazia partecipativa.
    longDescription: |
      Sardegna ParteciPA è un fork di Decidim, la piattaforma spagnola di democrazia partecipativa.

      Sardegna ParteciPA usa il core di Decidim e personalizza o integra solo i seguenti aspetti:

      - Utilizzo del Sistema Pubblico di Identità Digitale (SPID), della Carta di Identità Elettronica (CIE) e della Carta Nazionale dei Servizi (CNS) attraverso la gem `decidim-spid-cie` con l'apposito middleware open source (https://github.com/dipartimentofunzionepubblica/decidim-module-spid-cie);
      - Aspetto grafico ridefinito via SCSS e templates;
      - Modifiche sul profilo dell’utente per soddisfare le indicazioni del GDPR con l'apposito modulo open-source (https://github.com/dipartimentofunzionepubblica/decidim-module-privacy);
      - Integrazione di moduli community: [Term-Customizer](https://github.com/mainio/decidim-module-term_customizer) e [Decidim-Awesome](https://github.com/Platoniq/decidim-module-decidim_awesome).
    features:
      - partecipazione democratica
      - testo partecipativo
      - processo partecipativo
    screenshots: []

